<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>집필</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="login-banner" hidden><span>구글 로그인이 만료됐어요. 쓴 글은 이 기기에 보관 중이에요.</span><button>다시 로그인</button></div>
  <main id="app"><p class="quiet">불러오는 중</p></main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" id="settings-form">
      <header class="dlg-head">
        <h2 id="settings-title" tabindex="-1" autofocus>설정</h2>
        <button value="close" class="link">닫기</button>
      </header>

      <section>
        <h3>분량 계산</h3>
        <fieldset class="units"><legend>세는 단위</legend>
          <label><input type="radio" name="unit" value="chars"> 글자 수</label>
          <label><input type="radio" name="unit" value="words"> 단어 수</label>
          <label><input type="radio" name="unit" value="sentences"> 문장 수</label>
          <label><input type="radio" name="unit" value="bytes"> 용량</label>
        </fieldset>
        <fieldset><legend>빼고 세기</legend>
          <label><input type="checkbox" name="noSpaces"> 공백</label>
          <label><input type="checkbox" name="noPunct"> 문장부호 <small>. , ! ? " …</small></label>
          <label><input type="checkbox" name="noSymbols"> 특수문자 <small>★ ♥ ~ +</small></label>
          <label><input type="checkbox" name="noComments"> 메모 줄 <small>//로 시작하는 줄</small></label>
        </fieldset>
        <fieldset><legend>한 회차 목표</legend>
          <label class="goal"><input type="number" name="goal" min="0" step="100" inputmode="numeric" aria-label="목표 분량"> <span id="goal-unit"></span> <small>0이면 목표 없음</small></label>
          <label><input type="checkbox" name="celebrate"> 목표에 닿으면 축하하기</label>
        </fieldset>
      </section>

      <section>
        <h3>입력 보조</h3>
        <label class="opt"><input type="checkbox" role="switch" name="autoQuotes">
          <span><b>모양 따옴표로 바꾸기</b><small>"를 치면 말 앞에서는 “, 뒤에서는 ”로 바뀌어요. '도 ‘ ’로 바뀌어요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="smartQuotes">
          <span><b>따옴표 짝 맞추기</b><small>여는 따옴표를 치면 닫는 따옴표가 같이 들어가요. 닫는 따옴표 바로 앞에서 Enter를 누르면 따옴표 밖 다음 줄로 넘어가요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="autoBrackets">
          <span><b>괄호 짝 맞추기</b><small>( [ { 를 치면 닫는 괄호가 같이 들어가요. 글을 선택하고 치면 그 글을 괄호로 감싸요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="smartBrackets">
          <span><b>괄호 밖으로 넘어가기</b><small>닫는 괄호 바로 앞에서 Enter를 누르면 괄호 밖 다음 줄로 넘어가요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="divider">
          <span><b>장면 구분선 맞추기</b><small>한 줄에 --- 나 —— 나 *** 만 쓰고 Enter를 누르면 * * * 로 바뀌어요.</small></span></label>
      </section>

      <p class="quiet">설정은 이 기기에만 저장돼요.</p>
    </form>
  </dialog>
</body>
</html>
