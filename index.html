<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>집필</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="login-banner" hidden><span>구글 로그인이 만료됐어요. 쓴 글은 이 기기에 보관 중이에요.</span><button>다시 로그인</button></div>
  <main id="app"><p class="quiet">불러오는 중</p></main>

  <dialog id="settings" class="panel" aria-labelledby="settings-title">
    <form method="dialog" id="settings-form" class="panel-form">
      <header class="dlg-head">
        <h2 id="settings-title" tabindex="-1" autofocus>설정</h2>
        <button value="close" class="link">닫기</button>
      </header>

      <section>
        <h3>분량 계산</h3>
        <fieldset class="units"><legend>세는 단위</legend>
          <label><input type="radio" name="unit" value="chars"> 글자 수</label>
          <label><input type="radio" name="unit" value="words"> 단어 수</label>
          <label><input type="radio" name="unit" value="sentences"> 문장 수</label>
          <label><input type="radio" name="unit" value="bytes"> 용량</label>
        </fieldset>
        <fieldset><legend>빼고 세기</legend>
          <label><input type="checkbox" name="noSpaces"> 공백</label>
          <label><input type="checkbox" name="noPunct"> 문장부호 <small>. , ! ? " …</small></label>
          <label><input type="checkbox" name="noSymbols"> 특수문자 <small>★ ♥ ~ +</small></label>
          <label><input type="checkbox" name="noComments"> 메모 줄 <small>//로 시작하는 줄</small></label>
        </fieldset>
        <fieldset><legend>한 회차 목표</legend>
          <label class="goal"><input type="number" name="goal" min="0" step="100" inputmode="numeric" aria-label="목표 분량"> <span id="goal-unit"></span> <small>0이면 목표 없음</small></label>
          <label><input type="checkbox" name="celebrate"> 목표에 닿으면 축하하기</label>
        </fieldset>
      </section>

      <section>
        <h3>입력 보조</h3>
        <label class="opt"><input type="checkbox" role="switch" name="autoQuotes">
          <span><b>모양 따옴표로 바꾸기</b><small>"를 치면 말 앞에서는 “, 뒤에서는 ”로 바뀌어요. '도 ‘ ’로 바뀌어요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="smartQuotes">
          <span><b>따옴표 짝 맞추기</b><small>여는 따옴표를 치면 닫는 따옴표가 같이 들어가요. 닫는 따옴표 바로 앞에서 Enter를 누르면 따옴표 밖 다음 줄로 넘어가요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="autoBrackets">
          <span><b>괄호 짝 맞추기</b><small>( [ { 를 치면 닫는 괄호가 같이 들어가요. 글을 선택하고 치면 그 글을 괄호로 감싸요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="smartBrackets">
          <span><b>괄호 밖으로 넘어가기</b><small>닫는 괄호 바로 앞에서 Enter를 누르면 괄호 밖 다음 줄로 넘어가요.</small></span></label>
        <label class="opt"><input type="checkbox" role="switch" name="divider">
          <span><b>장면 구분선 맞추기</b><small>한 줄에 --- 나 —— 나 *** 만 쓰고 Enter를 누르면 * * * 로 바뀌어요.</small></span></label>
      </section>

      <section>
        <h3>Claude 컨셉</h3>
        <label class="field" for="aiConcept"><span>Claude가 맡을 역할과 말투<small>Claude에게 물을 때마다 맨 앞에 같이 들어가요. 비워 두면 기본 Claude로 대답해요.</small></span></label>
        <textarea id="aiConcept" name="aiConcept" rows="5" placeholder="예: 너는 20년 차 장르소설 편집자 '윤 편집장'이다. 짧고 직설적으로 말하고, 칭찬 하나에 지적 둘을 섞는다. 독자가 지루해할 지점을 가장 먼저 짚는다."></textarea>
      </section>

      <section>
        <h3>Claude 프로젝트</h3>
        <label class="field" for="aiProject"><span>프로젝트 주소<small>claude.ai에서 프로젝트를 열고 주소창의 주소를 붙여 넣으세요. "Claude 열기"가 늘 이 프로젝트를 열어요. 비워 두면 새 대화가 열려요.</small></span></label>
        <input type="url" id="aiProject" name="aiProject" placeholder="https://claude.ai/project/…" inputmode="url">
      </section>

      <p class="quiet">설정은 이 기기에만 저장돼요.</p>
    </form>
  </dialog>

  <dialog id="ask" class="panel" aria-labelledby="ask-title">
    <form method="dialog" id="ask-form" class="panel-form">
      <header class="dlg-head">
        <h2 id="ask-title" tabindex="-1" autofocus>Claude에게 묻기</h2>
        <button value="close" class="link">닫기</button>
      </header>
      <fieldset class="presets"><legend>무엇을 부탁할까요</legend>
        <label><input type="radio" name="preset" value="write"> 설정대로 이번 화 쓰기</label>
        <label><input type="radio" name="preset" value="feedback" checked> 피드백 받기</label>
        <label><input type="radio" name="preset" value="check"> 설정과 맞는지 보기</label>
        <label><input type="radio" name="preset" value="polish"> 문장 다듬기</label>
        <label><input type="radio" name="preset" value="continue"> 다음 장면 이어 쓰기</label>
        <label><input type="radio" name="preset" value="free"> 직접 쓰기</label>
      </fieldset>
      <label class="field" for="ask-extra"><span>덧붙일 말</span></label>
      <textarea id="ask-extra" name="extra" rows="3" placeholder="예: 서윤의 대사가 너무 딱딱한지 봐줘"></textarea>
      <p class="quiet">이 회차 본문, 설정 메모, Claude 컨셉이 함께 복사돼요.</p>
      <div class="row">
        <button type="button" id="ask-copy" class="act">복사하기</button>
        <a id="ask-open" class="act ghost" href="https://claude.ai/new" target="_blank" rel="noopener" hidden>Claude 열기 ↗</a>
      </div>
      <p id="ask-done" class="quiet" aria-live="polite"></p>
    </form>
  </dialog>

  <dialog id="apply" class="panel" aria-labelledby="apply-title">
    <form method="dialog" id="apply-form" class="panel-form">
      <header class="dlg-head">
        <h2 id="apply-title" tabindex="-1" autofocus>수정본 반영</h2>
        <button value="close" class="link">닫기</button>
      </header>
      <label class="field" for="apply-pasted"><span>Claude의 답을 그대로 붙여 넣으세요<small>답 속의 수정본이나 이어쓰기 부분만 골라서 반영해요.</small></span></label>
      <textarea id="apply-pasted" name="pasted" rows="5"></textarea>
      <fieldset><legend>어떻게 반영할까요</legend>
        <label><input type="radio" name="mode" value="replace" checked> 원고 전체를 수정본으로 바꾸기</label>
        <label><input type="radio" name="mode" value="append"> 원고 끝에 붙이기</label>
      </fieldset>
      <p id="apply-summary" class="quiet"></p>
      <div id="apply-preview" class="diff" hidden></div>
      <div class="row">
        <button type="button" id="apply-ok" class="act" disabled>반영하기</button>
      </div>
      <p class="quiet">반영한 뒤에도 원고에서 Ctrl+Z로 되돌릴 수 있어요.</p>
    </form>
  </dialog>
</body>
</html>
